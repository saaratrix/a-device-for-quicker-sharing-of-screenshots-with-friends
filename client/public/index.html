<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Upload a file</title>
  <link href="./src/main.css" rel="stylesheet">
</head>
<body>
<div class="container">
  <div id="uploader" hidden="hidden">
    <div class="uploader-contents">
      <div class="upload-inputs">
        <header>
          <div>
            <h1>Luniebox</h1>
            <p>Upload and share files.</p>
          </div>
          <div class="menu">
            <button class="menu-button strip-button history" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M3 12a9 9 0 1 0 3-6.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M3 4v5h5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M12 7v5l3 2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

              <span>History</span>
            </button>
            <button class="menu-button strip-button settings">
               <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="3" />
                  <path
                    d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.15.38.37.72.66 1 .3.28.68.43 1.1.43H21v4h-.1a1.7 1.7 0 0 0-1.5.57Z"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
            </button>
          </div>
        </header>
        <hr class="header-divisor">
        <div class="form-field">
          <div class="file-area">
            <single-file-picker id="fileInput" preview-max-size="200" fullpage-dnd fullpage-paste ></single-file-picker>
          </div>
        </div>
        <div class="form-field">
          <label for="secret" class="label">Extra Secret: </label>
          <input id="secret" type="text">
        </div>
        <div class="form-field">
          <label for="filename" class="label">Filename: </label>
          <input id="filename" type="text">
        </div>
      </div>
      <div>
        <upload-editing />
      </div>
      <br>
      <button id="upload-btn" type="submit" disabled>
         <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M12 16V4M12 4L7.5 8.5M12 4L16.5 8.5M5 19V21H19V19"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Upload
      </button>
      <p id="upload-error" class="error" hidden="hidden"></p>
    <!-- end of uploader-contents -->
    </div>
    <div id="link-share" class="invisible">
      <div class="link-container">
        <a href="#" class="link-text"></a>
        <i class="link-copy-btn" title="click to copy">⎘</i>
      </div>
    </div>
    <div id="preview-container"></div>
  </div>
  <div id="viewer" hidden="hidden">
    <div class="view-item-container">
      <div id="view-item"></div>
      <viewer-controls />
    </div>
  </div>
  <div class="dialog-backdrop"></div>
  <dialog class="history-dialog dialog">
    <div class="history-dialog-content">
      <h1>Previous items</h1>
      <div class="history-items"></div>
    </div>
  </dialog>
  <dialog class="settings-dialog dialog">
    <div class="settings-dialog-content">
      <h1>Settings, many choices.</h1>
      <div class="settings-list">
        <div class="settings-adapt-height settings-row" title="If checked it will limit the height of the image, video to the height of your browser.">
          <label for="automaticallyAdjustHeight">Automatically adjust height:</label>
          <div><input type="checkbox" id="automaticallyAdjustHeight"></div>
        </div>
        <div class="settingss-viewer-controls-placement settings-row">
          <label for="viewerControlsPlacement">Settings position:</label>
          <select id="viewerControlsPlacement">
            <option value="page:left">Page Top Left</option>
            <option value="page:right">Page Top Right</option>
            <option value="item:left">Image Top Left</option>
            <option value="item:right">Image Top Right</option>
          </select>
        </div>
      </div>
    </div>
  </dialog>
</div>
<script src="./src/app.js" type="module"></script>
</body>
</html>
